<!-- FINAL PROFESSIONAL contact.html -->

<!DOCTYPE html>
<html>

<head>

<title>Contact</title>

<style>

body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(to right,#fff3e0,#f5ebe0);
    text-align:center;
}

.navbar{
    background:#5d4037;
    padding:18px;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin:18px;
    font-size:21px;
    font-weight:bold;
}

.navbar a:hover{
    color:#ffd54f;
}

.contact-box{
    background:white;
    width:450px;

    margin:auto;
    margin-top:70px;

    padding:40px;

    border-radius:20px;

    box-shadow:0px 0px 15px gray;
}

.contact-box img{
    width:120px;
}

h1{
    color:#5d4037;
}

input,
textarea{
    width:80%;
    padding:14px;
    margin:12px;

    border-radius:10px;
    border:1px solid gray;

    font-size:18px;
}

textarea{
    height:120px;
}

button{
    background:#6d4c41;
    color:white;

    border:none;

    padding:15px 35px;

    font-size:20px;

    border-radius:12px;

    cursor:pointer;

    transition:0.5s;
}

button:hover{
    background:black;
    transform:scale(1.08);
}

.footer{
    background:#5d4037;
    color:white;
    padding:20px;
    margin-top:80px;
}

</style>

</head>

<body>

<div class="navbar">

<a href="login.html">Login</a>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="order.html">Order</a>
<a href="contact.html">Contact</a>

</div>

<div class="contact-box">

<img src="https://cdn-icons-png.flaticon.com/512/561/561127.png">

<h1>Contact Us</h1>

<input type="text" placeholder="Enter Name">

<br>

<input type="email" placeholder="Enter Email">

<br>

<textarea placeholder="Enter Message"></textarea>

<br><br>

<button>Send Message</button>

</div>

<div class="footer">

<p>Connect With Coffee Cafe</p>

</div>

</body>
</html>
